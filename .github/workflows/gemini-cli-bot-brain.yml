name: '🧠 Gemini CLI Bot: Brain'

on:
  schedule:
    - cron: '0 0 * * *' # Every 24 hours
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      run_interactive:
        description: 'Run interactive flow (requires issue_number)'
        type: 'boolean'
        default: false
      issue_number:
        description: 'Issue/PR number to simulate context from'
        type: 'string'
        required: false
      comment_id:
        description: 'Specific comment ID to simulate'
        type: 'string'
        required: false
      clear_memory:
        description: 'Clear memory (drops learnings from previous runs)'
        type: 'boolean'
        default: false
      enable_prs:
        description: 'Enable PRs (automatically promote changes to PRs)'
        type: 'boolean'
        default: false

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.issue_number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: 'write'
  issues: 'write'
  pull-requests: 'write'
  actions: 'write'

jobs:
  run-brain:
    name: 'Background Agent (Brain)'
    if: "github.repository == 'google-gemini/gemini-cli' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_interactive != 'true'))"
    uses: ./.github/workflows/gemini-cli-bot-core.yml
    with:
      prompt_path: 'tools/gemini-cli-bot/brain/metrics.md'
      enable_prs: ${{ github.event.inputs.enable_prs == 'true' }}
      clear_memory: ${{ github.event.inputs.clear_memory == 'true' }}
    secrets: inherit

  run-interactive:
    name: 'Interactive Agent'
    if: "github.repository == 'google-gemini/gemini-cli' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.run_interactive == 'true') || (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini-cli-robot') && contains(fromJSON('[\"COLLABORATOR\", \"MEMBER\", \"OWNER\"]'), github.event.comment.author_association)))"
    uses: ./.github/workflows/gemini-cli-bot-core.yml
    with:
      prompt_path: 'tools/gemini-cli-bot/brain/interactive.md'
      enable_prs: true
      trigger_issue_number: '${{ github.event.issue.number || github.event.inputs.issue_number }}'
      trigger_comment_id: '${{ github.event.comment.id || github.event.inputs.comment_id }}'
      memory_workflow: '🧠 Gemini CLI Bot: Brain'
    secrets: inherit
